header{padding:22px 0 14px;text-align:center;border-bottom:2px solid var(--pri)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}

label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}

.sm{width:auto;margin:0;padding:8px 12px;font-size:14px}.gray{background:var(--line)!important;color:var(--ink)!important}
.pair{display:flex;gap:8px}.pair button{margin-top:8px;padding:9px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pri);color:#fff}
